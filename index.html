<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Kate's Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: phone-first column. A clay-style 3D stage holds your hero; quests, creator and shop sit below in chunky "squishy" cards. */
:root{
  --bg:#fff4f7; --bg2:#fde9f0; --card:#ffffff; --ink:#4a3a4f; --muted:#9a879e; --line:#f3dbe4;
  --pink:#ff8fb1; --pink-deep:#ef6a96; --pink-dark:#c94c78; --mint:#8edbc4; --mint-deep:#4fb99a; --butter:#ffd98a; --lav:#c3b2ff; --sky:#9fd3ff;
  --stage-a:#ffe3ee; --stage-b:#e8e2ff; --over:#ff7f7f; --on-accent:#ffffff;
  --shadow:0 10px 24px rgba(201,76,120,.14), inset 0 -4px 0 rgba(201,76,120,.08), inset 0 2px 0 rgba(255,255,255,.9);
  --display:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --text:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211a26; --bg2:#2c2233; --card:#33283d; --ink:#f7e9f1; --muted:#bba7c4; --line:#4a3b54;
  --pink:#ff9cbc; --pink-deep:#ff7fa8; --pink-dark:#c9567f; --mint:#7fd6bd; --mint-deep:#6ccfb0; --butter:#ffd47a; --lav:#b9a6ff; --sky:#8ec9f7;
  --stage-a:#3d2c47; --stage-b:#2b2c4d; --over:#ff8f8f; --on-accent:#ffffff;
  --shadow:0 10px 24px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211a26; --bg2:#2c2233; --card:#33283d; --ink:#f7e9f1; --muted:#bba7c4; --line:#4a3b54;
  --pink:#ff9cbc; --pink-deep:#ff7fa8; --pink-dark:#c9567f; --mint:#7fd6bd; --mint-deep:#6ccfb0; --butter:#ffd47a; --lav:#b9a6ff; --sky:#8ec9f7;
  --stage-a:#3d2c47; --stage-b:#2b2c4d; --over:#ff8f8f; --on-accent:#ffffff;
  --shadow:0 10px 24px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.06); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:520px;margin:0 auto;padding-block:14px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.clay{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.btn3d{border:0;border-radius:16px;background:var(--pink-deep);color:var(--on-accent);font-family:var(--display);font-weight:600;
  box-shadow:0 5px 0 var(--pink-dark),0 10px 18px rgba(201,76,120,.25);transition:transform .08s,box-shadow .08s}
.btn3d:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-dark),0 4px 8px rgba(201,76,120,.2)}
.btn3d:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--bg2);cursor:default}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;color:var(--pink-deep)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 11px;
  font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.chip svg{width:16px;height:16px}

/* stage */
.hero{overflow:hidden;padding:0}
.stage{position:relative;aspect-ratio:1/.94;max-height:540px;width:100%;background:radial-gradient(120% 90% at 50% 20%,var(--stage-a),var(--stage-b));border-radius:24px 24px 0 0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer;display:block}
.stage .hint{position:absolute;right:12px;bottom:14px;text-align:right;max-width:34%;z-index:2;font-size:11px;font-weight:800;color:var(--muted);opacity:.8}
.rooms{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.rooms button{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.rooms button[aria-pressed="true"]{background:var(--pink-deep);color:var(--on-accent);box-shadow:0 3px 0 var(--pink-dark)}
.say{position:relative;background:var(--bg2);border-radius:16px;padding:9px 13px;font-size:14px;font-weight:800;margin-bottom:12px;overflow-wrap:anywhere}
.say::before{content:"";position:absolute;left:24px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--bg2)}
.nofx{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-weight:800}
.herobar{padding:12px 16px 16px}
.lvl-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.lvl{font-family:var(--display);font-weight:600;font-size:16px;color:var(--pink-deep)}
.rank{font-weight:800;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.bar{height:18px;background:var(--bg2);border-radius:999px;margin-top:10px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;width:0;border-radius:999px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),inset 0 3px 0 rgba(255,255,255,.4);
  background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,var(--pink-deep) 10px 20px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.xpnum{font-size:12.5px;color:var(--muted);font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}

.today{display:flex;gap:12px;align-items:center;padding:12px 16px}
.today svg{flex:none}
.today b{font-family:var(--display);font-size:17px}
.today p{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:700}

.tabs{display:flex;gap:4px;padding:5px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-weight:800;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pink-deep);color:var(--on-accent);box-shadow:0 3px 0 var(--pink-dark)}

/* quests */
.list{display:flex;flex-direction:column;gap:10px}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 12px 12px 14px;border:2px solid transparent;transition:opacity .3s}
.q.overdue{border-color:color-mix(in srgb,var(--over) 45%,transparent)}
.q.done{opacity:.6}
.q.done .qt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--pink)}
.q.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.04)}}
.check{width:36px;height:36px;border-radius:12px;border:3px solid var(--pink);background:var(--card);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--line)}
.check svg{width:20px;height:20px;opacity:0}
.q.done .check{background:var(--mint);border-color:var(--mint-deep)}
.q.done .check svg{opacity:1}
.qbody{min-width:0}
.qt{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--bg2);color:var(--muted)}
.tag.easy{background:color-mix(in srgb,var(--mint) 30%,var(--card));color:var(--ink)}
.tag.med{background:color-mix(in srgb,var(--butter) 40%,var(--card));color:var(--ink)}
.tag.hard{background:color-mix(in srgb,var(--lav) 40%,var(--card));color:var(--ink)}
.tag.late{background:color-mix(in srgb,var(--over) 25%,var(--card));color:var(--ink)}
.tag.ex{border:1.5px dashed var(--line);background:transparent}
.del{border:0;background:transparent;width:34px;height:34px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.del:hover{background:var(--bg2)}
.del svg{width:18px;height:18px}
.del.sure{width:auto;padding:0 10px;background:var(--over);color:#fff;font-weight:800;font-size:13px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-weight:700;background:var(--card);border-radius:22px;border:2px dashed var(--line)}
.empty b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:4px}

/* creator */
.panel{padding:16px;display:flex;flex-direction:column;gap:16px}
.panel h3{font-size:20px}
.panel .sub{margin:-10px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.field>label,.field>.lab{display:block;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:0;background:var(--bg2);border-radius:14px;padding:9px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line)}
.opt[aria-pressed="true"]{background:var(--pink-deep);color:var(--on-accent);box-shadow:0 3px 0 var(--pink-dark)}
.opt.big{flex:1;padding:14px;font-family:var(--display);font-size:17px;font-weight:600}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line),inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.35);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pink-deep),inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.35)}
.txt{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font:inherit;font-weight:800;color:var(--ink)}
.startq{padding:15px;font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat small{font-weight:800;color:var(--muted);font-size:12px}

/* shop */
.wallet{display:flex;align-items:center;gap:12px;padding:14px 16px}
.wallet b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.wallet p{margin:0;color:var(--muted);font-weight:700;font-size:13px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.item{padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent}
.item.on{border-color:var(--pink-deep)}
.thumb{width:84px;height:84px;border-radius:20px;background:radial-gradient(circle at 50% 35%,var(--stage-a),var(--stage-b));display:grid;place-items:center}
.thumb img{width:84px;height:84px}
.item b{font-family:var(--display);font-size:15px}
.item small{color:var(--muted);font-weight:800;font-size:12px}
.item .btn3d{margin-top:6px;padding:7px 14px;font-size:14px;border-radius:12px;width:100%}
.item .btn3d.ghost{background:var(--bg2);color:var(--ink);box-shadow:0 4px 0 var(--line)}

/* add sheet */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  font-size:18px;padding:14px 26px;border-radius:999px;display:flex;gap:8px;align-items:center;z-index:5}
.fab:active{transform:translate(-50%,4px)}
.fab svg{width:20px;height:20px}
.sheet-bg{position:fixed;inset:0;background:rgba(40,20,40,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet label{font-weight:800;font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.sheet input{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font:inherit;font-weight:700;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:0;background:var(--bg2);border-radius:14px;padding:9px 6px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--line)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--pink) 30%,var(--card));box-shadow:0 3px 0 var(--pink-deep)}
.seg button small{display:block;color:var(--muted);font-size:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{padding:14px;font-size:18px}
.cancel{border:0;background:transparent;color:var(--muted);font-weight:800;padding:6px}

.lvlup{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(40,20,40,.4);padding:16px}
.lvlup .card{padding:28px 22px;text-align:center;max-width:340px;width:100%;animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{from{transform:scale(.6);opacity:0}}
.lvlup .big{font-family:var(--display);font-size:72px;font-weight:700;color:var(--pink-deep);line-height:1;text-shadow:0 5px 0 var(--bg2)}
.lvlup h2{font-size:26px;margin-top:6px}
.lvlup p{font-weight:700;color:var(--muted);margin:8px 0 18px}
.lvlup .go{width:100%}

.floatxp{position:fixed;z-index:25;font-family:var(--display);font-weight:700;color:var(--pink-deep);font-size:22px;pointer-events:none;animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.spark{position:fixed;z-index:24;width:10px;height:10px;border-radius:3px;pointer-events:none}
.save-note{text-align:center;color:var(--muted);font-size:12px;font-weight:700}
html,body{height:100%;overflow:hidden}
.stage{position:fixed;inset:0;aspect-ratio:auto;max-height:none;border-radius:0;z-index:0}
.stage canvas{border-radius:0}
.maplabels{border-radius:0}
.hud{position:fixed;top:0;left:0;z-index:5;width:min(440px,100%);display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hud .brand{font-size:21px;text-shadow:0 2px 0 #ffffffcc}
.hud .chips{gap:6px}
.hud .chip{padding:5px 10px}
.focusrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1.5px dashed var(--line)}
.fdot{width:10px;height:10px;border-radius:50%;background:var(--mint-deep);box-shadow:0 0 0 0 var(--mint);animation:fpulse 1.6s infinite;flex:none}
@keyframes fpulse{70%{box-shadow:0 0 0 7px transparent}}
.flabel{font-weight:800;font-size:12.5px;color:var(--muted);flex:1}
.fclock{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.02em}
.focusrow.paused .fdot{background:var(--muted);animation:none}
.focusrow.paused .fclock{color:var(--muted)}
.chip.zoom{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:13px;color:var(--ink)}
.herocard{padding:10px 14px 10px;border-radius:20px}
.herocard .hname{font-size:18px}
.herocard .bar{height:12px;margin-top:7px}
.herocard .xpnum{margin-top:4px;font-size:12px}
.say-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.say-row .zoom{flex:none;white-space:nowrap;position:static;box-shadow:var(--shadow);padding:9px 12px}
.hud .say{margin:0;flex:0 1 auto;min-width:0;box-shadow:var(--shadow);background:var(--card)}
.hud .say::before{display:none}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(80,40,70,.18);
  display:flex;flex-direction:column;max-height:46dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.tall{max-height:66dvh}
.grab{border:0;background:transparent;padding:8px 0 2px;display:grid;place-items:center;width:100%}
.grab i{display:block;width:44px;height:5px;border-radius:9px;background:var(--line)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.drawer .today{padding:0;box-shadow:none;background:none}
.drawer .today b{font-size:16px}
.addq{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:16px;border-radius:999px;flex:none}
.addq svg{width:18px;height:18px}
.drawer-body{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;
  padding-block:2px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.drawer.collapsed .drawer-body{display:none}
.drawer .tabs{background:var(--bg2);box-shadow:none;flex:none}
@media (min-width:900px){
  .drawer{left:auto;top:12px;right:12px;bottom:12px;width:400px;max-height:none;border-radius:24px}
  .drawer.tall{max-height:none}
  .grab{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.maplabels{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:24px 24px 0 0}
.zoom{position:absolute;right:10px;top:10px;z-index:2;border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.maplabels.far span:not(.big){display:none}
.maplabels span.big{font-size:15px;opacity:.75;letter-spacing:.16em;background:#ffffffcc;padding:2px 8px;border-radius:8px}
.maplabels span{position:absolute;left:0;top:0;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;color:#4a3a4f;opacity:.5;white-space:nowrap}
.qbody{cursor:pointer}
.tag.loc{background:color-mix(in srgb,var(--sky) 35%,var(--card));color:var(--ink)}
.spots{display:flex;gap:6px;flex-wrap:wrap}
.spots button{border:0;background:var(--bg2);border-radius:999px;padding:6px 11px;font-weight:800;font-size:12.5px;box-shadow:0 2px 0 var(--line)}
.spots button[aria-pressed="true"]{background:var(--pink-deep);color:var(--on-accent);box-shadow:0 2px 0 var(--pink-dark)}
/* study groups */
.chip.gchip{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:13px;color:var(--ink)}
.maplabels .ptag{position:absolute;left:0;top:0;font-family:var(--display);font-weight:600;font-size:12px;color:#4a3a4f;background:#ffffffe6;padding:2px 9px;border-radius:999px;box-shadow:0 2px 0 rgba(201,76,120,.25);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.gp-sec{display:flex;flex-direction:column;gap:8px}
.gp-sec>h4{margin:0;font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow .txt{flex:1;min-width:0;padding:10px 12px}
.inrow .btn3d{flex:none;padding:10px 16px;font-size:16px}
.gp-code{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.2em;color:var(--pink-deep);line-height:1}
.gp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gp-ghost{border:0;border-radius:12px;background:var(--bg2);padding:8px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--line)}
.gp-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px}
.gp-dot{width:32px;height:32px;border-radius:50%;flex:none;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line),inset 0 -3px 0 rgba(0,0,0,.12)}
.gp-main{flex:1;min-width:0}
.gp-main b{font-weight:800}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const XP = {easy:10, med:25, hard:50};
const SIZE_LABEL = {easy:"Tiny", med:"Medium", hard:"Big"};
const RANKS = ["Sprout","Sprout","Bean","Dumpling","Puff","Sweet Bun","Cloud Cake","Star Mochi","Moon Mochi","Legend"];
const CHEERS = ["Nice! One step closer.","You did it!","Look at you go!","That's a win. Keep rolling.","So proud of you!","Quest cleared!"];
const IDLE = ["Hi! Let's do one small thing today.","Pick the tiniest quest first.","I believe in you.","A little progress still counts."];

const SKINS=["#ffe3d0","#f7cba8","#e2ab84","#c08259","#8f5a3a","#62402a"];
const HAIRC=["#4a3030","#7a4a2a","#f0bf5a","#ff9ab8","#9d8cff","#5aaee6","#2e2b36","#f3eef4"];
const EYES=["#3a2c40","#4a6fd1","#3f9a6e","#9a5f2c","#b0478a"];
const OUTFITS=["#ff8fb1","#8edbc4","#ffd98a","#9fd3ff","#c3b2ff","#ffa07a","#ffffff"];
const HAIRS=[["short","Short"],["spiky","Spiky"],["bob","Bob"],["long","Long"],["pigtails","Pigtails"],["bun","Bun"]];
const ITEMS=[
  {id:"bow",name:"Ribbon bow",slot:"clip",cost:30},
  {id:"flower",name:"Flower clip",slot:"clip",cost:30},
  {id:"cat",name:"Cat ears",slot:"head",cost:50},
  {id:"bunny",name:"Bunny ears",slot:"head",cost:70},
  {id:"wand",name:"Star wand",slot:"hand",cost:80},
  {id:"backpack",name:"Backpack",slot:"back",cost:90},
  {id:"chick",name:"Chick buddy",slot:"buddy",cost:120},
  {id:"wings",name:"Fairy wings",slot:"back",cost:160},
  {id:"halo",name:"Star halo",slot:"head",cost:220},
  {id:"crown",name:"Tiny crown",slot:"head",cost:260},
  {id:"sparkles",name:"Sparkle aura",slot:"aura",cost:320},
];
const LOCS={home:{name:"Home",spots:[["desk","Study desk"],["bed","Bedroom"],["kitchen","Kitchen"],["dining","Dining table"],["living","Living room"],["bath","Bathroom"],["laundry","Laundry"],["balcony","Balcony"],["door","Front door"]]}};
const locParts=l=>{if(!l)return null;const [m,sp]=l.split(":");const M_=LOCS[m];if(!M_)return null;const f=M_.spots.find(x=>x[0]===sp);return f?{map:m,spot:sp,mapName:M_.name,spotName:f[1]}:null};
const SLOT_LABEL={clip:"Hair clip",head:"Head",hand:"Hand",back:"Back",buddy:"Buddy",aura:"Aura"};

const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(key,n)=>{const [y,m,d]=key.split("-").map(Number);return dayKey(new Date(y,m-1,d+n))};
const needFor=lvl=>50+(lvl-1)*25;
const uid=()=>Math.random().toString(36).slice(2,10);
const defaultLook=()=>({name:"",gender:"girl",hair:"pigtails",hairColor:HAIRC[1],skin:SKINS[1],eye:EYES[0],outfit:OUTFITS[0]});

function fresh(){
  const t=dayKey();
  return {v:2,xp:0,lvl:1,wallet:0,total:0,streak:0,best:0,lastDay:null,sample:true,made:false,
    look:defaultLook(),owned:[],equip:{},room:"home",
    tasks:[
      {id:uid(),title:"Drink a glass of water",size:"easy",due:t,time:"",rep:"daily",done:null,ex:true,loc:"home:kitchen"},
      {id:uid(),title:"Tidy your desk for 10 minutes",size:"med",due:t,time:"",rep:"once",done:null,ex:true,loc:"home:desk"},
      {id:uid(),title:"Start the big assignment",size:"hard",due:addDays(t,2),time:"18:00",rep:"once",done:null,ex:true,loc:"home:desk"},
    ]};
}
function migrate(s){
  if(!s.look) s.look=defaultLook();
  if(!s.owned) s.owned=[]; if(!s.equip) s.equip={};
  if(s.wallet==null) s.wallet=s.tasks.filter(q=>q.done).reduce((a,q)=>a+XP[q.size],0);
  if(s.made==null) s.made=false;
  s.tasks.forEach(q=>{if(q.loc&&!q.loc.startsWith("home:"))q.loc=""});
  s.v=2; return s;
}

let S=fresh(), tab="quests", pendingDel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const heroName=()=>S.look.name.trim()||"Your hero";

/* ---------- storage: private per-person doc, with this-device fallback ---------- */
const LS="mochi-quest-v1";
function lsGet(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
let saveTimer=null, docRef=null;
function save(){
  lsSet(S); clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ if(!docRef) return;
    try{await docRef.set({json:JSON.stringify(S),at:Date.now()});note("Saved to your account")}catch(e){note("Saved on this device")}},600);
}
function note(t){$("saveNote").textContent=t}
async function connect(){
  const local=lsGet(); if(local){S=migrate(local);afterLoad()}
  try{
    if(!window.claude||!window.claude.use){note(local?"Saved on this device":"");return}
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){note("Saved on this device");return}
    const id=await user.id(); if(!id){note("Saved on this device");return}
    docRef=db.doc("data/users/"+id+"/game");
    const snap=await Promise.race([docRef.get(),new Promise(r=>setTimeout(()=>r("timeout"),10000))]);
    if(snap==="timeout"){note("Saved on this device");return}
    const d=snap&&snap.data&&snap.data();
    if(d&&d.json){const remote=JSON.parse(d.json); if(!local||(remote.total||0)>=(local.total||0)) S=migrate(remote)}
    afterLoad(); save(); note("Saved to your account");
  }catch(e){note("Saved on this device")}
}
function afterLoad(){ rollover(); if(!S.made) tab="me"; render(); Hero.rebuild(); }

function rollover(){
  const t=dayKey();
  S.tasks.forEach(q=>{ if(q.rep==="daily"&&q.done&&q.done!==t){q.done=null;q.due=t} if(q.rep==="daily"&&!q.done&&q.due<t) q.due=t; });
  if(S.lastDay&&S.lastDay<addDays(t,-1)) S.streak=0;
}

/* =====================================================================
   3D hero (three.js, toon shaded)
   ===================================================================== */
const Hero=(function(){
  const ok=!!window.THREE && (()=>{try{const c=document.createElement("canvas");return !!(c.getContext("webgl")||c.getContext("experimental-webgl"))}catch(e){return false}})();
  if(!ok){ const n=document.createElement("div");n.className="nofx";n.textContent="Your browser can't show 3D here, but your quests still work.";$("stage").appendChild(n);
    return {rebuild(){},cheer(){},thumb(){return ""},spin(){},setZoom(){},goTo(){return false},setMarkers(){},onSpotTap(){},onAct(){},
      state(){return null},setOthers(){},roomAt(){return ""},onOther(){},onWave(){}}; }
  const T=THREE;
  const grad=new T.DataTexture(new Uint8Array([120,175,215,235]),4,1,T.LuminanceFormat);
  grad.minFilter=grad.magFilter=T.NearestFilter; grad.needsUpdate=true;
  const mats={};
  const lin=c=>new T.Color(c).convertSRGBToLinear();
  const toon=(c,extra)=>{const k=c+(extra?JSON.stringify(extra):"");if(mats[k])return mats[k];const o=Object.assign({color:lin(c),roughness:.62,metalness:0},extra||{});if(o.emissive)o.emissive=o.emissive.clone().convertSRGBToLinear();return mats[k]=new T.MeshStandardMaterial(o)};
  const shadowize=o=>o.traverse(m=>{if(m.isMesh){m.castShadow=!m.material.transparent&&m.material.type!=="MeshBasicMaterial";m.receiveShadow=true}});
  const M=(geo,col,x=0,y=0,z=0,extra)=>{const m=new T.Mesh(geo,toon(col,extra));m.position.set(x,y,z);return m};
  const shade=(hex,amt)=>"#"+new T.Color(hex).lerp(new T.Color(amt<0?"#2a1830":"#ffffff"),Math.abs(amt)).getHexString();
  const S_=(r,ws=24,hs=18)=>new T.SphereGeometry(r,ws,hs);

  function starGeo(r=.25,d=.08){const s=new T.Shape();for(let i=0;i<10;i++){const a=i/10*Math.PI*2+Math.PI/2,rr=i%2?r*.48:r;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?s.lineTo(x,y):s.moveTo(x,y)}
    const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.04,bevelSize:.04,bevelSegments:3});g.center();return g}

  /* ---- accessories: each built at its own origin, then attached ---- */
  const ACC={
    bow(){const g=new T.Group(),c="#ff6f9f";const w=S_(.2);[-1,1].forEach(s=>{const m=M(w,c,s*.2,0,0);m.scale.set(1.1,.75,.5);g.add(m)});g.add(M(S_(.1),shade(c,-.15)));return g},
    flower(){const g=new T.Group();for(let i=0;i<5;i++){const a=i/5*Math.PI*2;const p=M(S_(.12),"#ffffff",Math.cos(a)*.14,Math.sin(a)*.14,0);p.scale.set(1,1,.5);g.add(p)}g.add(M(S_(.09),"#ffd24a",0,0,.04));return g},
    cat(){const g=new T.Group();[-1,1].forEach(s=>{const e=new T.Group();const o=M(new T.ConeGeometry(.28,.5,4),"#4a3030");o.rotation.y=Math.PI/4;const i=M(new T.ConeGeometry(.17,.32,4),"#ff9ab8",0,-.04,.08);i.rotation.y=Math.PI/4;e.add(o,i);e.position.set(s*.5,0,0);e.rotation.z=-s*.35;g.add(e)});g.userData.tint=true;return g},
    bunny(){const g=new T.Group();[-1,1].forEach(s=>{const e=new T.Group();const o=M(S_(.2),"#ffffff");o.scale.set(.85,2.6,.6);const i=M(S_(.12),"#ffb6cc",0,0,.08);i.scale.set(.8,2.6,.5);e.add(o,i);e.position.set(s*.28,.25,0);e.rotation.z=-s*.18;g.add(e)});return g},
    crown(){const g=new T.Group(),gold="#ffcc4d";g.add(M(new T.CylinderGeometry(.42,.38,.2,24,1,true),gold,0,0,0,{side:T.DoubleSide}));
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2;const c=M(new T.ConeGeometry(.08,.22,8),gold,Math.sin(a)*.4,.2,Math.cos(a)*.4);g.add(c);g.add(M(S_(.045,10,8),"#ff6f9f",Math.sin(a)*.41,.31,Math.cos(a)*.41))}return g},
    halo(){const g=new T.Group();const t=M(new T.TorusGeometry(.5,.06,10,40),"#ffd66b",0,0,0,{emissive:new T.Color("#ffb300"),emissiveIntensity:.35});t.rotation.x=Math.PI/2;g.add(t);
      for(let i=0;i<5;i++){const a=i/5*Math.PI*2;const s=M(starGeo(.09,.03),"#fff2a8",Math.cos(a)*.5,.03,Math.sin(a)*.5,{emissive:new T.Color("#ffcc00"),emissiveIntensity:.3});g.add(s)}return g},
    wand(){const g=new T.Group();g.add(M(new T.CylinderGeometry(.035,.035,.7,10),"#c9a2ff",0,.35,0));const s=M(starGeo(.2,.08),"#ffd84d",0,.78,0,{emissive:new T.Color("#ffb000"),emissiveIntensity:.25});g.add(s);g.userData.star=s;return g},
    backpack(){const g=new T.Group(),c="#ffb36b";const b=M(S_(.42),c);b.scale.set(1,1.05,.6);g.add(b);const p=M(S_(.24),shade(c,-.12),0,-.12,.2);p.scale.set(1,.8,.5);g.add(p);g.add(M(S_(.05,10,8),"#ffffff",0,0,.31));return g},
    wings(){const g=new T.Group();const parts=[];[-1,1].forEach(s=>{const w=new T.Group();const a=M(S_(.42),"#f4efff",0,0,0,{transparent:true,opacity:.9});a.scale.set(1.1,.75,.12);a.position.set(s*.42,.18,0);const b=M(S_(.3),"#ffe0f0",0,0,0,{transparent:true,opacity:.9});b.scale.set(1,.7,.12);b.position.set(s*.32,-.3,0);w.add(a,b);w.userData.s=s;parts.push(w);g.add(w)});g.userData.wings=parts;return g},
    chick(){const g=new T.Group(),y="#ffd84d";const b=M(S_(.32),y,0,.32,0);b.scale.set(1,.95,1);g.add(b);g.add(M(S_(.06,10,8),"#3a2c40",-.12,.42,.27),M(S_(.06,10,8),"#3a2c40",.12,.42,.27));
      const k=M(new T.ConeGeometry(.07,.14,8),"#ff9a3c",0,.33,.32);k.rotation.x=Math.PI/2;g.add(k);[-1,1].forEach(s=>{const w=M(S_(.12),shade(y,-.08),s*.3,.3,0);w.scale.set(.5,.9,.9);g.add(w)});
      const t=M(S_(.07,10,8),y,0,.66,0);t.scale.set(.6,1.4,.6);g.add(t);[-1,1].forEach(s=>{const c=M(S_(.05,10,8),"#ffa8c0",s*.2,.3,.25);c.scale.set(1,.6,.4);g.add(c)});return g},
    sparkles(){const g=new T.Group();const list=[];for(let i=0;i<8;i++){const s=M(starGeo(.1,.04),["#ffd84d","#ff9ab8","#9fd3ff","#c3b2ff"][i%4],0,0,0,{emissive:new T.Color("#ffffff"),emissiveIntensity:.25});s.userData.i=i;list.push(s);g.add(s)}g.userData.sparks=list;return g},
  };
  const ATTACH={ // where each slot sits on the hero
    clip:{to:"head",pos:[.72,.72,.46],rot:[0,.4,-.4]},
    head:{cat:{to:"head",pos:[0,.95,-.05]},bunny:{to:"head",pos:[0,1.05,-.15]},crown:{to:"head",pos:[0,.95,0]},halo:{to:"head",pos:[0,1.45,0]}},
    hand:{to:"handR",pos:[0,-.05,.05],rot:[.5,0,0]},
    back:{wings:{to:"root",pos:[0,1.62,-.28],s:.75},backpack:{to:"root",pos:[0,1.45,-.3],s:.6}},
    buddy:{to:"world",pos:[1.15,0,.45]},
    aura:{to:"root",pos:[0,0,0]},
  };

  /* ---- the hero ---- */
  function buildHero(L,equip){
    const root=new T.Group(), parts={};
    const skin=L.skin, out=L.outfit, hc=L.hairColor, girl=L.gender==="girl";
    const pants=girl?shade(out,.25):shade(out==="#ffffff"?"#9fd3ff":out,-.35), shoe=shade(out==="#ffffff"?"#c3b2ff":out,-.45);
    ["L","R"].forEach((k,i)=>{const s=i?1:-1;const lg=new T.Group();lg.position.set(s*.13,1.0,0);
      lg.add(M(new T.CylinderGeometry(.1,.08,.92,16),girl?skin:pants,0,-.46,0));
      const f=M(S_(.12),shoe,0,-.94,.05);f.scale.set(1,.6,1.6);lg.add(f);root.add(lg);parts["leg"+k]=lg});
    if(girl) root.add(M(new T.CylinderGeometry(.27,.5,.5,28),shade(out,.15),0,1.02,0));
    else root.add(M(new T.CylinderGeometry(.27,.28,.24,24),pants,0,1.04,0));
    root.add(M(new T.CylinderGeometry(.27,.25,.62,24),out,0,1.45,0));
    const sh=M(S_(.29,24,14),out,0,1.74,0);sh.scale.set(1.12,.42,.85);root.add(sh);
    root.add(M(S_(.03,10,8),"#ffffff",0,1.6,.255),M(S_(.03,10,8),"#ffffff",0,1.42,.255));
    root.add(M(new T.CylinderGeometry(.065,.07,.2,12),skin,0,1.87,0));

function fmtDue(q){
  const t=dayKey();let d;
  if(q.due===t)d="Today";else if(q.due===addDays(t,1))d="Tomorrow";else if(q.due===addDays(t,-1))d="Yesterday";
  else{const [y,m,dd]=q.due.split("-").map(Number);d=new Date(y,m-1,dd).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
  if(q.time){const [h,mi]=q.time.split(":").map(Number);d+=" "+new Date(2000,0,1,h,mi).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
  return d;
}
function isOverdue(q){if(q.done||!q.due)return false;const t=dayKey();if(q.due<t)return true;
  if(q.due===t&&q.time){const n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())>q.time}return false}
function questRow(q){
  const late=isOverdue(q);
  const tags=[`<span class="tag ${q.size}">${SIZE_LABEL[q.size]} · +${XP[q.size]} XP</span>`];
  if(q.due) tags.push(`<span class="tag ${late?"late":""}">${late?"Overdue · ":""}${fmtDue(q)}</span>`);
  const lp=locParts(q.loc); if(lp) tags.push(`<span class="tag loc">${lp.spotName}</span>`);
  if(q.rep==="daily") tags.push(`<span class="tag">Every day</span>`);
  if(q.ex) tags.push(`<span class="tag ex">Example</span>`);
  const sure=pendingDel===q.id;
  return `<div class="clay q ${q.done?"done":""} ${late?"overdue":""}" data-id="${q.id}">
    <button class="check" data-act="toggle" aria-label="${q.done?"Mark not done":"Complete"}: ${esc(q.title)}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="qbody" data-act="go" title="Walk there"><div class="qt">${esc(q.title)}</div><div class="meta">${tags.join("")}</div></div>
    <button class="del ${sure?"sure":""}" data-act="del" aria-label="Delete ${esc(q.title)}">${sure?"Delete?":`<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}</button>
  </div>`;
}

function goDo(q){

  $("say").textContent=`Heading to the ${lp.spotName.toLowerCase()}...`;
  Hero.goTo(q.loc,()=>{$("say").textContent=`At the ${lp.spotName.toLowerCase()}! Do "${q.title}", then tap the check.`});
}
Hero.onAct(a=>{$("say").textContent=a.say;if(a.open==="me"){tab="me";setDrawer(true);render()}});
Hero.onSpotTap(spot=>{
  const qs=S.tasks.filter(q=>!q.done&&q.loc===spot);const lp=locParts(spot);
  if(!qs.length||!lp)return;
  $("say").textContent=`Heading to the ${lp.spotName.toLowerCase()}...`;
  Hero.goTo(spot,()=>{$("say").textContent=`${lp.spotName}: "${qs[0].title}"`+(qs.length>1?` and ${qs.length-1} more`:"")+`. Tap the check when done!`});
});
function complete(q,el){
  const t=dayKey();
  if(q.done){
    S.xp-=XP[q.size];S.wallet=Math.max(0,S.wallet-XP[q.size]);S.total=Math.max(0,S.total-1);
    while(S.xp<0&&S.lvl>1){S.lvl--;S.xp+=needFor(S.lvl)}if(S.xp<0)S.xp=0;
    q.done=null;save();render();return;
  }
  q.done=t;S.total++;S.wallet+=XP[q.size];
  if(S.lastDay!==t){S.streak=S.lastDay===addDays(t,-1)?S.streak+1:1;S.lastDay=t;S.best=Math.max(S.best,S.streak)}
  S.xp+=XP[q.size];let leveled=false;
  while(S.xp>=needFor(S.lvl)){S.xp-=needFor(S.lvl);S.lvl++;leveled=true}
  burst(el,"+"+XP[q.size]+" XP");
  $("say").textContent=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  const lp=locParts(q.loc);
  if(lp){ if(!Hero.goTo(q.loc,()=>Hero.cheer())) Hero.cheer() } else Hero.cheer();
  if(q.rep==="once"&&tab==="quests"){el.classList.add("pop");setTimeout(render,380)}else render();
  if(leveled)setTimeout(levelUp,700);
  save();
}
function levelUp(){
  $("lvlupN").textContent=S.lvl;
  const next=ITEMS.filter(i=>!S.owned.includes(i.id)&&i.cost<=S.wallet).sort((a,b)=>b.cost-a.cost)[0];
  $("lvlupMsg").textContent=`${heroName()} is now a ${RANKS[Math.min(S.lvl,RANKS.length-1)]}. `+(next?`You can afford the ${next.name.toLowerCase()} in the Shop!`:`You have ${S.wallet} XP to spend in the Shop.`);
  $("lvlup").hidden=false;$("lvlOk").focus();Hero.spin();
  confetti(window.innerWidth/2,window.innerHeight/2,36);
}
function burst(el,text){
  const r=el.querySelector(".check").getBoundingClientRect();
  const f=document.createElement("div");f.className="floatxp";f.textContent=text;
  f.style.left=(r.left+r.width+6)+"px";f.style.top=(r.top-4)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  confetti(r.left+r.width/2,r.top+r.height/2,14);
}
function confetti(x,y,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["--pink","--mint","--butter","--lav","--sky"].map(c=>getComputedStyle(document.documentElement).getPropertyValue(c).trim());
  for(let i=0;i<n;i++){const s=document.createElement("div");s.className="spark";s.style.background=cols[i%cols.length];
    s.style.left=x+"px";s.style.top=y+"px";if(i%3===0)s.style.borderRadius="50%";document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=40+Math.random()*90;
    s.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:800+Math.random()*400,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove()}
}

document.addEventListener("click",e=>{
  const gt=e.target.closest("[data-goto]");if(gt){const k=gt.dataset.goto.split(":")[0];
    $("say").textContent={home:"Heading home!",school:"Off to school!",cafe:"Café time! Mmm, cake."}[k];Hero.goTo(gt.dataset.goto);return}
  if(e.target.closest("#zoomBtn")){zoomOut=!zoomOut;Hero.setZoom(!zoomOut);$("zoomBtn").textContent=zoomOut?"Follow me":"Whole house";return}
  const tb=e.target.closest(".tabs button");if(tb){tab=tb.dataset.tab;pendingDel=null;render();return}
  const lk=e.target.closest("[data-look]");
  if(lk){const k=lk.dataset.look,v=lk.dataset.v;S.look[k]=v;
    if(k==="gender") S.look.hair=v==="girl"?"pigtails":"short";
    save();render();Hero.rebuild();return}
  if(e.target.id==="startBtn"){S.made=true;tab="quests";save();render();$("say").textContent=`Hi, I'm ${heroName()}! Tap furniture to use it.`;Hero.cheer();return}
  const buy=e.target.closest("[data-buy]");
  if(buy){const it=ITEMS.find(i=>i.id===buy.dataset.buy);if(it&&S.wallet>=it.cost){S.wallet-=it.cost;S.owned.push(it.id);S.equip[it.slot]=it.id;
    $("say").textContent=`Ooh, a new ${it.name.toLowerCase()}!`;save();render();Hero.rebuild();Hero.spin();
    const r=buy.getBoundingClientRect();confetti(r.left+r.width/2,r.top,18)}return}
  const eq=e.target.closest("[data-equip]");
  if(eq){const it=ITEMS.find(i=>i.id===eq.dataset.equip);S.equip[it.slot]=S.equip[it.slot]===it.id?null:it.id;save();render();Hero.rebuild();return}
  const mpb=e.target.closest("[data-mp]");if(mpb){mpClick(mpb);return}
  if(e.target.closest("#gChip")){tab="group";setDrawer(true);render();return}
  const btn=e.target.closest("[data-act]");
  if(!btn){if(pendingDel){pendingDel=null;render()}return}
  const row=btn.closest(".q");const q=S.tasks.find(x=>x.id===row.dataset.id);if(!q)return;
  if(btn.dataset.act==="toggle"){pendingDel=null;complete(q,row)}
  if(btn.dataset.act==="go"){pendingDel=null;goDo(q)}
  if(btn.dataset.act==="del"){if(pendingDel===q.id){S.tasks=S.tasks.filter(x=>x.id!==q.id);pendingDel=null;save();render()}else{pendingDel=q.id;render()}}
});
document.addEventListener("input",e=>{if(e.target.id==="f-name"){S.look.name=e.target.value;renderHead();save()}});

function setDrawer(open){$("drawer").classList.toggle("collapsed",!open);$("grab").setAttribute("aria-expanded",open)}
$("grab").onclick=()=>setDrawer($("drawer").classList.contains("collapsed"));
let fSize="easy",fRep="once";
function segs(id,set){$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));set(b.dataset.v)})}
segs("f-size",v=>fSize=v);segs("f-rep",v=>fRep=v);
let fSpot="";
function drawSpots(){$("f-spot").innerHTML=[["","Anywhere"],...LOCS.home.spots].map(([k,n])=>`<button type="button" data-spot="${k}" aria-pressed="${k===fSpot}">${n}</button>`).join("")}
function setMap(){fSpot="";drawSpots()}
$("f-spot").addEventListener("click",e=>{const b=e.target.closest("[data-spot]");if(!b)return;fSpot=b.dataset.spot;drawSpots()});
$("addBtn").onclick=()=>{$("f-date").value=dayKey();setMap("any");$("sheetBg").hidden=false;setTimeout(()=>$("f-title").focus(),50)};
$("cancel").onclick=()=>{$("sheetBg").hidden=true};
$("sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")$("sheetBg").hidden=true});
$("form").addEventListener("submit",e=>{
  e.preventDefault();const title=$("f-title").value.trim();if(!title)return;
  if(S.sample){S.tasks=S.tasks.filter(q=>!q.ex||q.done);S.sample=false}
  S.tasks.push({id:uid(),title,size:fSize,due:$("f-date").value||dayKey(),time:$("f-time").value||"",rep:fRep,done:null,loc:fSpot?"home:"+fSpot:""});
  $("f-title").value="";$("f-time").value="";$("sheetBg").hidden=true;tab="quests";save();render();
  $("say").textContent="New quest accepted! You've got this.";
});
$("lvlOk").onclick=()=>{$("lvlup").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("sheetBg").hidden=true;$("lvlup").hidden=true}});

$("say").textContent=IDLE[Math.floor(Math.random()*IDLE.length)];
afterLoad();
setInterval(()=>{rollover();renderHead()},60000);

/* ---------- focus time: 1 XP per minute while the page is open and visible ---------- */
function gainXP(n){
  S.xp+=n;S.wallet+=n;let leveled=false;
  while(S.xp>=needFor(S.lvl)){S.xp-=needFor(S.lvl);S.lvl++;leveled=true}
  renderHead();if(leveled)setTimeout(levelUp,300);
}
function fmtClock(sec){const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60,x=sec%60;return `${h}:${pad(m)}:${pad(x)}`}
function fmtFocus(sec){const m=Math.floor(sec/60),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`}
// Counts while the page is open, even in a background tab. Uses the real clock, because
// browsers slow down timers in background tabs. A gap over 5 minutes (computer asleep) is not counted.
let lastTick=Date.now(),lastSaved=0;
function focusTick(){
  const now=Date.now(),gap=(now-lastTick)/1000;lastTick=now;
  const t=dayKey();if(!S.focus||S.focus.day!==t)S.focus={day:t,sec:0};
  if(S.made&&gap>0&&gap<=300){
    const before=Math.floor(S.focus.sec);S.focus.sec+=gap;const after=Math.floor(S.focus.sec);
    const mins=Math.floor(after/60)-Math.floor(before/60),bonus=Math.floor(after/1500)-Math.floor(before/1500);
    if(mins>0){gainXP(mins);S.focusTotal=(S.focusTotal||0)+mins;
      if(document.visibilityState==="visible"){const c=$("focusChip").getBoundingClientRect(),f=document.createElement("div");f.className="floatxp";f.textContent="+"+mins+" XP";
        f.style.left=c.left+"px";f.style.top=(c.bottom+4)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
      if(bonus>0){gainXP(5*bonus);$("say").textContent=`${Math.floor(after/60)} minutes of focus today! +${5*bonus} bonus XP.`;Hero.cheer()}
      save()}
    if(now-lastSaved>15000){lastSaved=now;lsSet(S)}}
  $("focusChip").classList.toggle("paused",!S.made);
  $("focusLabel").textContent="Focusing today";
  $("focusTime").textContent=fmtClock(Math.floor(S.focus.sec));
}
setInterval(focusTick,1000);
window.addEventListener("pagehide",()=>{focusTick();lsSet(S)});
document.addEventListener("visibilitychange",()=>{focusTick();if(document.visibilityState==="hidden")save()});
/* =====================================================================
   Online study groups. Uses the claude.ai "room" capability, so it needs no
   server or account setup: everyone with the game's Claude link open shares a
   lobby, and each group code is its own room. Only your hero, name, level,
   position in the house and focus time are shared. Quests never leave you.
   ===================================================================== */
const ACT_WORDS={desk:"Studying at the desk",dining:"Studying at the table",island:"Coffee break",books:"Picking a book",beanbag:"Reading",
  bed:"Napping",sofa:"Relaxing",tv:"Watching a show",stove:"Cooking",fridge:"Grabbing a snack",tub:"Taking a bath",tub2:"Taking a bath",
  sink:"Brushing teeth",toilet:"Quick break",washer:"Doing laundry",basket:"Folding clothes",balcony:"Getting fresh air",
  wardrobe:"Picking an outfit",dresser:"Getting ready",plant:"Watering plants"};
const POSES=["sit","sitwork","bath","readsit","lie","use","read","water"];
const MP={state:"loading",lobby:null,group:null,code:"",gname:"",lobbyPeers:[],peers:[],joinedAt:0,joining:false,err:"",names:{}};
const GKEY="kates-day-group";
const cleanName=v=>typeof v!=="string"?"":v.replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,"").trim().slice(0,24);
const cleanCode=v=>String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8);
const pick=(v,list)=>list.includes(v)?v:list[0];
const num=(v,lo,hi,d=0)=>typeof v==="number"&&isFinite(v)?Math.max(lo,Math.min(hi,v)):d;
function safeLook(l){l=l&&typeof l==="object"?l:{};
  return {name:"",gender:l.gender==="boy"?"boy":"girl",hair:HAIRS.some(h=>h[0]===l.hair)?l.hair:"short",hairColor:pick(l.hairColor,HAIRC),skin:pick(l.skin,SKINS),eye:pick(l.eye,EYES),outfit:pick(l.outfit,OUTFITS)}}
function safeEquip(e){const o={};if(e&&typeof e==="object")ITEMS.forEach(it=>{if(e[it.slot]===it.id)o[it.slot]=it.id});return o}
const myName=()=>S.look.name.trim().slice(0,24)||"Friend";
const focusMin=()=>S.focus&&S.focus.day===dayKey()?Math.floor(S.focus.sec/60):0;
let waveAt=0;
function sayMsg(t){$("say").textContent=t}

function lobbyMe(){return {n:myName(),lv:S.lvl,g:MP.code||null,gn:MP.code?(MP.gname||null):null}}
function groupMe(){const st=Hero.state()||{x:0,z:0,ry:0,pose:null,act:null};const L=S.look;
  return {n:myName(),lv:S.lvl,look:{gender:L.gender,hair:L.hair,hairColor:L.hairColor,skin:L.skin,eye:L.eye,outfit:L.outfit},eq:safeEquip(S.equip),
    x:st.x,z:st.z,ry:st.ry,p:st.pose,a:st.act,f:focusMin(),w:waveAt||null,gn:MP.gname||null}}
let lastLobby="",lastGroup="";
function pushPresence(){
  if(MP.lobby){const me=lobbyMe(),j=JSON.stringify(me);if(j!==lastLobby){lastLobby=j;MP.lobby.presence(me).catch(()=>{})}}
  if(MP.group){const me=groupMe(),j=JSON.stringify(me);if(j!==lastGroup){lastGroup=j;MP.group.presence(me).catch(()=>{})}}
}
setInterval(pushPresence,150);

function viewPeer(p){const q=p.presence||{};
  return {id:p.peer,me:p.sameTab,name:cleanName(q.n)||"Friend",lv:Math.floor(num(q.lv,1,999,1)),look:safeLook(q.look),equip:safeEquip(q.eq),
    x:num(q.x,-6.8,6.8),z:num(q.z,-6.3,6.3),ry:num(q.ry,-20,20),pose:q.p&&POSES.includes(q.p.t)?{type:q.p.t,h:num(q.p.h,0,1,.3)}:null,
    act:typeof q.a==="string"&&ACT_WORDS[q.a]?q.a:null,f:Math.floor(num(q.f,0,1440)),wave:num(q.w,0,1e14),has:typeof q.x==="number"}}
function groupPeers(){return MP.peers.filter(p=>p.kind==="viewer").map(viewPeer)}

async function mpStart(){
  let room=null;
  try{ if(window.claude&&window.claude.use) room=await claude.use("room") }catch(e){}
  if(!room){MP.state="off";groupDirty(true);return}
  MP.lobby=room;MP.state="on";
  room.onPeers(ch=>{MP.lobbyPeers=ch.peers;groupDirty()},e=>{MP.state="off";MP.lobby=null;MP.group=null;MP.peers=[];Hero.setOthers([]);groupDirty(true)});
  pushPresence();
  let saved=null;try{saved=JSON.parse(localStorage.getItem(GKEY)||"null")}catch(e){}
  if(saved&&saved.code)joinGroup(saved.code,saved.name,true);
  groupDirty(true);
}
async function joinGroup(code,name,quiet){
  code=cleanCode(code);if(!code||!MP.lobby||MP.joining)return;
  if(MP.group&&MP.code===code)return;
  if(MP.group)await leaveGroup(true);
  MP.joining=true;MP.err="";groupDirty(true);
  try{
    const g=await MP.lobby.join("kd-"+code);
    MP.group=g;MP.code=code;MP.gname=cleanName(name);MP.joinedAt=Date.now();MP.names={};lastGroup="";
    g.onPeers(ch=>{if(MP.group!==g)return;MP.peers=ch.peers;onGroupPeers()},
      e=>{if(MP.group!==g)return;MP.group=null;MP.peers=[];Hero.setOthers([]);MP.err="You were disconnected from the group. Tap Join to try again.";groupDirty(true)});
    try{localStorage.setItem(GKEY,JSON.stringify({code,name:MP.gname}))}catch(e){}
    if(!quiet)sayMsg(`You're in ${MP.gname||"the study group"}! Friends who join walk around your house with you.`);
  }catch(e){MP.err=e&&e.code==="not_permitted"?"Study groups aren't available for this account here.":"Couldn't join right now. Try again in a moment."}
  MP.joining=false;pushPresence();groupDirty(true);
}
async function leaveGroup(quiet){
  const g=MP.group;MP.group=null;MP.code="";MP.gname="";MP.peers=[];Hero.setOthers([]);
  try{localStorage.removeItem(GKEY)}catch(e){}
  if(g)try{await g.leave()}catch(e){}
  if(!quiet)sayMsg("You left the study group. Back to studying solo.");
  pushPresence();groupDirty(true);
}
function onGroupPeers(){
  const ps=groupPeers();
  Hero.setOthers(ps.filter(p=>!p.me&&p.has));
  if(!MP.gname){const p=MP.peers.find(p=>cleanName(p.presence&&p.presence.gn));if(p){MP.gname=cleanName(p.presence.gn);try{localStorage.setItem(GKEY,JSON.stringify({code:MP.code,name:MP.gname}))}catch(e){}}}
  const settled=Date.now()-MP.joinedAt>3000,now={};
  ps.forEach(p=>{if(p.me||!p.has)return;now[p.id]=p.name;if(settled&&!MP.names[p.id])sayMsg(`${p.name} joined your study group!`)});
  if(settled)Object.keys(MP.names).forEach(id=>{if(!now[id])sayMsg(`${MP.names[id]} left the study group.`)});
  MP.names=now;
  groupDirty();
}
Hero.onWave(()=>{waveAt=Date.now()});
Hero.onOther(id=>{const p=groupPeers().find(x=>x.id===id);if(!p)return;
  sayMsg(`${p.name} (Lv ${p.lv}) · ${Hero.roomAt(p.x,p.z)} · ${p.act?ACT_WORDS[p.act]:"Hanging out"} · ${fmtFocus(p.f*60)} of focus today. You waved!`);
  waveAt=Date.now();Hero.cheer()});

let gTimer=null,gLast=0;
function groupDirty(now){
  const ps=MP.group?groupPeers():[];
  $("gChip").hidden=!MP.group;$("gCount").textContent=ps.length||1;
  if(tab!=="group")return;
  if(now){clearTimeout(gTimer);gTimer=null;gLast=Date.now();render();return}
  if(gTimer)return;
  gTimer=setTimeout(()=>{gTimer=null;gLast=Date.now();if(tab==="group")drawGroupLists()},Math.max(0,800-(Date.now()-gLast)));
}
function memberRow(p){
  const where=p.has?`${Hero.roomAt(p.x,p.z)} · ${p.act?ACT_WORDS[p.act]:"Hanging out"}`:"Just arrived";
  return `<div class="clay gp-row"><span class="gp-dot" style="background:${p.look.outfit}"></span>
    <div class="gp-main"><b>${esc(p.name)}</b>${p.me?`<span class="gp-you">you</span>`:""} <small>Lv ${p.lv} · ${esc(where)}</small></div>
    <span class="gp-f" title="Focus time today">${fmtFocus(p.f*60)}</span></div>`}
function openGroups(){
  const m={};MP.lobbyPeers.forEach(p=>{const q=p.presence||{},c=cleanCode(q.g);if(!c||c===MP.code||p.kind!=="viewer")return;
    const g=m[c]||(m[c]={code:c,name:"",n:0});g.n++;if(!g.name)g.name=cleanName(q.gn)});
  return Object.values(m).sort((a,b)=>b.n-a.n).slice(0,8)}
function drawGroupLists(){
  const ml=$("gpMembers");
  if(ml){const ps=groupPeers().sort((a,b)=>(b.me-a.me)||(b.f-a.f));
    ml.innerHTML=ps.length?ps.map(memberRow).join(""):`<div class="empty"><b>Just you so far</b>Share the code so friends can join.</div>`;
    const tot=ps.reduce((a,p)=>a+p.f,0);$("gpTotal").textContent=fmtFocus(tot*60)}
  const ol=$("gpOpen");
  if(ol){const gs=openGroups(),solo=MP.lobbyPeers.filter(p=>p.kind==="viewer"&&!p.sameTab&&!cleanCode(p.presence&&p.presence.g)).length;
    ol.innerHTML=(gs.length?gs.map(g=>`<div class="clay gp-row"><div class="gp-main"><b>${esc(g.name||"Study group")}</b><small>${g.n} studying · code ${g.code.toUpperCase()}</small></div>
      <button class="btn3d" style="padding:8px 14px;border-radius:12px" data-mp="join" data-code="${g.code}" data-name="${esc(g.name)}">Join</button></div>`).join("")
      :`<p class="gp-note">No open groups right now. Make one and share the code!</p>`)
      +(solo?`<p class="gp-note">${solo} other ${solo===1?"person is":"people are"} online studying solo.</p>`:"")}
}
function renderGroup(v){
  const privacy=`<p class="gp-note">Your quests stay private. Friends only see your hero, name, level, which room you're in, and your focus time today.</p>`;
  if(MP.state==="loading"){v.innerHTML=`<div class="clay panel"><h3>Study groups</h3><p class="sub">Connecting...</p></div>`;return}
  if(MP.state==="off"){v.innerHTML=`<div class="clay panel"><h3>Study groups</h3>
    <p class="sub">You're playing solo here. Study groups work when you open Kate's Day from its Claude link while signed in to Claude.</p>${privacy}</div>`;return}
  const err=MP.err?`<p class="gp-err">${esc(MP.err)}</p>`:"";
  if(!MP.group){
    v.innerHTML=`<div class="clay panel"><h3>Study together</h3>
      <p class="sub">Make a group or join a friend's. Everyone in a group shares one house, so you can walk around the rooms together while you study.</p>${err}
      <form class="gp-sec" data-mpform="make"><h4>Make a group</h4><div class="inrow"><input class="txt" id="g-name" maxlength="24" placeholder="Group name, e.g. Exam crew"><button class="btn3d" type="submit" ${MP.joining?"disabled":""}>Make</button></div></form>
      <form class="gp-sec" data-mpform="join"><h4>Join with a code</h4><div class="inrow"><input class="txt" id="g-code" maxlength="8" placeholder="Code" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em"><button class="btn3d" type="submit" ${MP.joining?"disabled":""}>Join</button></div></form>
      ${privacy}</div>
      <div class="gp-sec"><h4>Open groups</h4><div class="gp-sec" id="gpOpen"></div></div>`;
  } else {
    v.innerHTML=`<div class="clay panel">
      <div class="gp-head"><div><h3>${esc(MP.gname||"Study group")}</h3><p class="gp-note" style="margin-top:4px">Friends join with this code</p></div>
        <button class="gp-ghost" data-mp="leave">Leave</button></div>
      <div class="gp-head"><span class="gp-code">${MP.code.toUpperCase()}</span><button class="gp-ghost" data-mp="copy">Copy code</button></div>
      <div class="gp-total"><span class="gp-note" style="color:var(--ink)">Focused together today</span><b id="gpTotal">0m</b></div>
      ${err}<div class="gp-sec" id="gpMembers"></div>
      <p class="gp-note">Tap your hero to wave. Tap a friend's hero to see what they're up to.</p>${privacy}</div>`;
  }
  drawGroupLists();
}
function newCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function mpClick(b){
  const k=b.dataset.mp;
  if(k==="join")joinGroup(b.dataset.code,b.dataset.name);
  if(k==="leave")leaveGroup();
  if(k==="copy"){const c=MP.code.toUpperCase();
    try{navigator.clipboard.writeText(c).then(()=>sayMsg(`Copied ${c}. Send it to a friend!`),()=>sayMsg(`Your group code is ${c}.`))}catch(e){sayMsg(`Your group code is ${c}.`)}}
}
document.addEventListener("submit",e=>{const f=e.target.closest("[data-mpform]");if(!f)return;e.preventDefault();
  if(f.dataset.mpform==="make"){joinGroup(newCode(),$("g-name").value.trim()||`${myName()}'s group`)}
  else{const c=cleanCode($("g-code").value);if(!c){MP.err="Type the code your friend sent you.";groupDirty(true);return}joinGroup(c,"")}});
mpStart();
connect();
})();
</script>
